name: Release notes automation

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "newsfragments/**"
      - pyproject.toml
  pull_request:
    types:
      - closed
    branches:
      - main

jobs:
  prepare_release_notes:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Determine the next release version
        id: version
        shell: bash
        run: |
          latest=$(git describe --tags --abbrev=0 2>/dev/null || echo "0.0.0")
          version=${latest#v}
          IFS='.' read -r major minor patch <<< "$version"
          patch=$((patch + 1))
          next_version="$major.$minor.$patch"
          echo "version=$next_version" >> "$GITHUB_OUTPUT"
      - name: Compile release notes from Towncrier fragments
        run: |
          python -m pip install --upgrade pip
          python -m pip install towncrier
          python -m towncrier build --yes --version "${{ steps.version.outputs.version }}"
      - name: Create a pull request for the release notes
        uses: peter-evans/create-pull-request@v7
        with:
          branch: chore/release-notes
          title: "chore: update release notes"
          commit-message: "chore: update release notes"
          delete-branch: true
          body: |
            This PR refreshes `doc/changelog.rst` from the Towncrier fragments in `newsfragments/`.

            The repository intentionally keeps release-note management in a dedicated workflow instead of adopting `release-please`, because the project already relies on fragment-driven changelog updates.
          labels: release-notes

  tag_release:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.ref == 'chore/release-notes'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Read the release version from the changelog
        id: version
        shell: bash
        run: |
          version=$(python - <<'PY'
          import re
          from pathlib import Path
          text = Path('doc/changelog.rst').read_text()
          match = re.search(r'(?m)^(\d+\.\d+\.\d+)', text)
          if not match:
              raise SystemExit('No version heading found in doc/changelog.rst')
          print(match.group(1))
          PY
          )
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Create and push the release tag
        shell: bash
        run: |
          git tag -a "v${{ steps.version.outputs.version }}" -m "Release v${{ steps.version.outputs.version }}"
          git push origin "v${{ steps.version.outputs.version }}"
